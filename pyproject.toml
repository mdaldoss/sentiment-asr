[project]
name = "ssa"
version = "0.1.0"
description = "Speech Sentiment Analyzer — sentiment from raw speech, with prosody-sensitivity evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.2",
    "transformers>=4.44",
    "faster-whisper>=1.0",
    "praat-parselmouth>=0.4.3",
    "opensmile>=2.5",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
generate = ["cartesia>=1.0", "sounddevice>=0.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ssa = "ssa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access (deselect with '-m \"not network\"')",
    "slow: slow test, needs model download",
]
addopts = "-m 'not network' --strict-markers"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
